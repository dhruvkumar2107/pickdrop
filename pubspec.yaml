name: pickdrop
description: "PickDrop - On-demand goods delivery app for India"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^12.1.3

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  cloud_functions: ^6.0.0

  # Google Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  flutter_polyline_points: ^2.0.0
  # google_maps_webservice: ^0.0.20-nullsafety.5 (conflicts with polyline_points)
  http: ^1.2.1

  # Places Autocomplete
  # Payments
  razorpay_flutter: ^1.3.5

  # Local Storage & Config
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.2

  # Utilities
  intl: ^0.20.3
  uuid: ^4.2.1
  dartz: ^0.10.1
  # geohash: implemented in extensions.dart
  equatable: ^2.0.5
  freezed_annotation: ^3.0.0
  json_annotation: ^4.8.1

  # UI
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0
  lottie: ^2.7.0
  cached_network_image: ^4.0.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9

  # Permissions & Background
  permission_handler: ^12.0.0
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.4

  # Connectivity
  connectivity_plus: ^6.1.0

  # Phone & SMS
  country_picker: ^2.0.22
  pin_code_fields: ^8.0.1

  # Image Picker
  image_picker: ^1.0.4

  # Utils
  url_launcher: ^6.2.2
  share_plus: ^13.0.0
  package_info_plus: ^10.0.0

  cupertino_icons: ^1.0.8
  confetti: ^0.8.0
  fl_chart: ^1.2.0
  animations: ^3.0.0
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  freezed: ^3.0.0
  json_serializable: ^6.7.1
  custom_lint: 0.7.6
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/map/
    - .env

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
