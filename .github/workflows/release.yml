name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  functions:
    name: Functions build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      - name: Build
        working-directory: functions
        run: npm run build
      - name: Test
        working-directory: functions
        run: npm test

  android:
    name: Android AAB + APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true
      - name: Configure client runtime
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
        run: |
          set -eu
          for name in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_STORAGE_BUCKET FIREBASE_MESSAGING_SENDER_ID FIREBASE_APP_ID GOOGLE_MAPS_API_KEY RAZORPAY_KEY_ID; do
            if [ -z "$(printenv "$name")" ]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done
          {
            printf 'FIREBASE_API_KEY=%s\n' "$FIREBASE_API_KEY"
            printf 'FIREBASE_AUTH_DOMAIN=%s\n' "$FIREBASE_AUTH_DOMAIN"
            printf 'FIREBASE_PROJECT_ID=%s\n' "$FIREBASE_PROJECT_ID"
            printf 'FIREBASE_STORAGE_BUCKET=%s\n' "$FIREBASE_STORAGE_BUCKET"
            printf 'FIREBASE_MESSAGING_SENDER_ID=%s\n' "$FIREBASE_MESSAGING_SENDER_ID"
            printf 'FIREBASE_APP_ID=%s\n' "$FIREBASE_APP_ID"
            printf 'GOOGLE_MAPS_API_KEY=%s\n' "$GOOGLE_MAPS_API_KEY"
            printf 'RAZORPAY_KEY_ID=%s\n' "$RAZORPAY_KEY_ID"
            printf 'FUNCTIONS_REGION=us-central1\nTRACKING_BASE_URL=https://%s.web.app\nPHONE_AUTH_MODE=firebase\nUSE_FIREBASE_EMULATORS=false\n' "$FIREBASE_PROJECT_ID"
          } > .env
          cat > android/app/src/main/res/values/strings.xml <<EOF
          <resources>
              <string name="google_maps_key" translatable="false">$GOOGLE_MAPS_API_KEY</string>
          </resources>
          EOF
      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF
      - name: Build App Bundle
        run: flutter build appbundle --release
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Build APK
        run: flutter build apk --release --split-per-abi
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: build/app/outputs/flutter-apk/*.apk

